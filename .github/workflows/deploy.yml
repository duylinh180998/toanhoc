name: Test & Deploy (GitHub Pages)

# GitHub Pages của repo này phục vụ từ nhánh `gh-pages` (Settings → Pages → Deploy from a branch).
# Mỗi lần push lên `main`: chạy test → build → ghi đè bản build mới lên nhánh `gh-pages`.
# Pull request chỉ chạy test + build (không deploy).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # để đẩy bản build lên nhánh gh-pages

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Chuẩn bị thư mục site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          cp dist/mathgraph-arena.html _site/
          touch _site/.nojekyll

      - name: Đẩy lên nhánh gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
